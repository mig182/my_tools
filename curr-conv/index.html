<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Currency Converter</title>

<style>
body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
    color:#172033;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    border:1px solid #dce2ea;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

h1{
    text-align:center;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    cursor:pointer;
}

.action-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px;
    border-radius:8px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#172033;
    color:white;
}

th, td{
    border:1px solid #dce2ea;
    padding:8px;
}

td:last-child{
    text-align:right;
}

.favorite{
    background:#fff8dc;
}

.star{
    cursor:pointer;
    font-size:18px;
}

.move{
    background:none;
    border:none;
    cursor:pointer;
}

.status{
    color:#555;
    margin-top:10px;
}

@media(max-width:800px){
    .controls{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🌍 All Currency Converter</h1>

<div class="controls">

<div>
<label>Amount</label>
<input id="amount" type="number" value="1" step="0.01">
</div>

<div>
<label>Base Currency</label>
<select id="base">
<option value="USD">USD</option>
<option value="INR" selected>INR</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
<option value="JPY">JPY</option>
<option value="AUD">AUD</option>
<option value="CAD">CAD</option>
<option value="CHF">CHF</option>
<option value="SGD">SGD</option>
<option value="AED">AED</option>
</select>
</div>

<div>
<label>Search</label>
<input id="search" placeholder="USD, INR, EUR...">
</div>

</div>

<button class="action-btn" onclick="loadRates()">
Refresh Rates
</button>

<p id="status" class="status">
Loading rates...
</p>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Fav</th>
<th>Move</th>
<th>Currency</th>
<th>Value</th>
</tr>
</thead>

<tbody id="results">
</tbody>

</table>

</div>

</div>

<script>

let rates = {};
let order = [];
let favorites =
JSON.parse(localStorage.getItem("favorites") || "[]");

function saveData(){
    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

    localStorage.setItem(
        "currencyOrder",
        JSON.stringify(order)
    );
}

function toggleFavorite(code){

    if(favorites.includes(code)){
        favorites =
        favorites.filter(x => x !== code);
    }
    else{
        favorites.push(code);
    }

    saveData();
    renderTable();
}

function moveUp(code){

    const idx = order.indexOf(code);

    if(idx > 0){

        [order[idx-1], order[idx]] =
        [order[idx], order[idx-1]];

        saveData();
        renderTable();
    }
}

function moveDown(code){

    const idx = order.indexOf(code);

    if(idx < order.length - 1){

        [order[idx+1], order[idx]] =
        [order[idx], order[idx+1]];

        saveData();
        renderTable();
    }
}

async function loadRates(){

    try{

        document.getElementById("status").innerText =
        "Loading rates...";

        const base =
        document.getElementById("base").value;

        const response = await fetch(
            `https://api.frankfurter.app/latest?from=${base}`
        );

        const data = await response.json();

        rates = data.rates;
        rates[base] = 1;

        const savedOrder =
        JSON.parse(
            localStorage.getItem("currencyOrder") || "[]"
        );

        if(savedOrder.length){

            order = savedOrder.filter(
                x => rates[x] !== undefined
            );

            Object.keys(rates).forEach(code => {

                if(!order.includes(code)){
                    order.push(code);
                }

            });

        } else {

            order = Object.keys(rates).sort();

        }

        document.getElementById("status").innerText =
        `Rates loaded for ${base}`;

        renderTable();

    }
    catch(err){

        console.error(err);

        document.getElementById("status").innerText =
        "Error loading rates.";
    }
}

function renderTable(){

    const amount =
    parseFloat(
        document.getElementById("amount").value
    ) || 0;

    const search =
    document.getElementById("search")
    .value
    .toUpperCase();

    let list = [...order];

    list.sort((a,b)=>{

        const af =
        favorites.includes(a) ? 0 : 1;

        const bf =
        favorites.includes(b) ? 0 : 1;

        if(af !== bf){
            return af - bf;
        }

        return order.indexOf(a) -
               order.indexOf(b);
    });

    let html = "";

    for(const code of list){

        if(search &&
           !code.includes(search)){
            continue;
        }

        const value =
        amount * rates[code];

        html += `
        <tr class="${
            favorites.includes(code)
            ? 'favorite'
            : ''
        }">

        <td>
        <span class="star"
        onclick="toggleFavorite('${code}')">
        ${
            favorites.includes(code)
            ? '⭐'
            : '☆'
        }
        </span>
        </td>

        <td>
        <button class="move"
        onclick="moveUp('${code}')">▲</button>

        <button class="move"
        onclick="moveDown('${code}')">▼</button>
        </td>

        <td>${code}</td>

        <td>
        ${value.toLocaleString(
            undefined,
            {
                maximumFractionDigits:4
            }
        )}
        </td>

        </tr>
        `;
    }

    document.getElementById("results").innerHTML =
    html;
}

document
.getElementById("amount")
.addEventListener(
    "input",
    renderTable
);

document
.getElementById("search")
.addEventListener(
    "input",
    renderTable
);

document
.getElementById("base")
.addEventListener(
    "change",
    loadRates
);

loadRates();

</script>

</body>
</html>
