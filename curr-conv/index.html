
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Currency Converter</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Segoe UI, Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 20px;
    color: #172033;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    border: 1px solid #dce2ea;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

h1 {
    text-align: center;
    margin-top: 0;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

button {
    cursor: pointer;
}

.action-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
}

.action-btn:hover {
    background: #1d4ed8;
}

.status {
    color: #555;
    margin-top: 12px;
    overflow-wrap: anywhere;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 450px;
}

th {
    background: #172033;
    color: white;
}

th, td {
    border: 1px solid #dce2ea;
    padding: 10px;
}

td:last-child {
    text-align: right;
}

.favorite {
    background: #fff8dc;
}

.star {
    cursor: pointer;
    font-size: 19px;
}

.move {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    padding: 4px;
}

.move:hover {
    color: #2563eb;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    margin-top: 20px;
}

@media(max-width: 800px) {

    .controls {
        grid-template-columns: 1fr;
    }

    body {
        padding: 10px;
    }

    .card {
        padding: 15px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🌍 All Currency Converter</h1>

<div class="controls">

<div>

<label>Amount</label>

<input
    id="amount"
    type="number"
    value="1"
    step="any"
    min="0"
>

</div>

<div>

<label>Base Currency</label>

<select id="base">

<option value="USD">USD</option>
<option value="INR" selected>INR</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
<option value="JPY">JPY</option>
<option value="AUD">AUD</option>
<option value="CAD">CAD</option>
<option value="CHF">CHF</option>
<option value="SGD">SGD</option>
<option value="AED">AED</option>

</select>

</div>

<div>

<label>Search Currency</label>

<input
    id="search"
    type="text"
    placeholder="Search USD, EUR, INR..."
>

</div>

</div>

<button
    class="action-btn"
    onclick="loadRates()"
>
    🔄 Refresh Rates
</button>

<p id="status" class="status">
Loading rates...
</p>

</div>


<div class="card">

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Fav</th>
<th>Move</th>
<th>Currency</th>
<th>Value</th>
</tr>

</thead>

<tbody id="results">

</tbody>

</table>

</div>

</div>


<div class="footer">

Exchange rates provided by
<a
    href="https://www.exchangerate-api.com"
    target="_blank"
    rel="noopener noreferrer"
>
    ExchangeRate-API
</a>

</div>

</div>


<script>

// =================================
// GLOBAL VARIABLES
// =================================

let rates = {};
let order = [];

let favorites = [];

try {
    favorites = JSON.parse(
        localStorage.getItem("favorites") || "[]"
    );

    if (!Array.isArray(favorites)) {
        favorites = [];
    }

} catch (err) {
    favorites = [];
}


// =================================
// SAVE DATA
// =================================

function saveData() {

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

    localStorage.setItem(
        "currencyOrder",
        JSON.stringify(order)
    );

}


// =================================
// TOGGLE FAVORITE
// =================================

function toggleFavorite(code) {

    if (favorites.includes(code)) {

        favorites = favorites.filter(
            x => x !== code
        );

    } else {

        favorites.push(code);

    }

    saveData();

    renderTable();

}


// =================================
// MOVE CURRENCY UP
// =================================

function moveUp(code) {

    const idx = order.indexOf(code);

    if (idx > 0) {

        [
            order[idx - 1],
            order[idx]
        ] = [
            order[idx],
            order[idx - 1]
        ];

        saveData();

        renderTable();

    }

}


// =================================
// MOVE CURRENCY DOWN
// =================================

function moveDown(code) {

    const idx = order.indexOf(code);

    if (idx >= 0 && idx < order.length - 1) {

        [
            order[idx + 1],
            order[idx]
        ] = [
            order[idx],
            order[idx + 1]
        ];

        saveData();

        renderTable();

    }

}


// =================================
// LOAD EXCHANGE RATES
// =================================

async function loadRates() {

    const status =
        document.getElementById("status");

    const base =
        document.getElementById("base").value;

    try {

        status.innerText =
            "Loading exchange rates...";

        const url =
            `https://open.er-api.com/v6/latest/${encodeURIComponent(base)}`;

        console.log("Fetching:", url);

        const response = await fetch(url);

        if (!response.ok) {

            throw new Error(
                "HTTP Error: " + response.status
            );

        }

        const data = await response.json();

        console.log("API Response:", data);

        if (
            data.result !== "success" ||
            !data.rates ||
            typeof data.rates !== "object"
        ) {

            throw new Error(
                data["error-type"] ||
                "Invalid exchange rate response"
            );

        }

        // Store rates

        rates = data.rates;

        // Base currency is always 1

        rates[base] = 1;


        // Restore saved currency order

        let savedOrder = [];

        try {

            savedOrder = JSON.parse(
                localStorage.getItem("currencyOrder") || "[]"
            );

            if (!Array.isArray(savedOrder)) {
                savedOrder = [];
            }

        } catch (err) {

            savedOrder = [];

        }


        if (savedOrder.length) {

            order = savedOrder.filter(
                code => rates[code] !== undefined
            );

            Object.keys(rates).forEach(code => {

                if (!order.includes(code)) {

                    order.push(code);

                }

            });

        } else {

            order = Object.keys(rates).sort();

        }


        saveData();


        // Display update date

        const updateDate =
            data.time_last_update_utc || "Unknown";

        status.innerText =
            `Successfully loaded ${Object.keys(rates).length} currencies | Base: ${base} | Updated: ${updateDate}`;

        renderTable();

    }

    catch (err) {

        console.error(
            "Currency loading error:",
            err
        );

        status.innerText =
            "Error loading rates: " + err.message;

    }

}

// =================================
// GET FULL CURRENCY NAME
// =================================

function getCurrencyName(code) {

    const names = new Intl.DisplayNames(
        ['en'],
        { type: 'currency' }
    );

    return names.of(code) || code;
}

// =================================
// RENDER CURRENCY TABLE
// =================================

function renderTable() {

    if (!Object.keys(rates).length) {
        return;
    }

    const amount =
        parseFloat(
            document.getElementById("amount").value
        ) || 0;

    const search =
        document.getElementById("search")
        .value
        .trim()
        .toUpperCase();


    let list = [...order];


    // Favorites first

    list.sort((a, b) => {

        const af =
            favorites.includes(a) ? 0 : 1;

        const bf =
            favorites.includes(b) ? 0 : 1;

        if (af !== bf) {
            return af - bf;
        }

        return order.indexOf(a) -
               order.indexOf(b);

    });


    let html = "";


    for (const code of list) {

        if (
            search &&
            !code.toUpperCase().includes(search)
        ) {
            continue;
        }

        if (rates[code] === undefined) {
            continue;
        }

        const value =
            amount * rates[code];


        html += `

        <tr class="${
            favorites.includes(code)
            ? "favorite"
            : ""
        }">

        <td>

            <span
                class="star"
                onclick="toggleFavorite('${code}')"
                title="Toggle favorite"
            >

            ${
                favorites.includes(code)
                ? "⭐"
                : "☆"
            }

            </span>

        </td>


        <td>

            <button
                class="move"
                onclick="moveUp('${code}')"
                title="Move up"
            >▲</button>

            <button
                class="move"
                onclick="moveDown('${code}')"
                title="Move down"
            >▼</button>

        </td>


        <td>
        <strong>${code} - ${getCurrencyName(code)}</strong>
        </td>


        <td>

            ${value.toLocaleString(
                undefined,
                {
                    maximumFractionDigits: 4
                }
            )}

        </td>

        </tr>

        `;

    }


    document.getElementById("results")
        .innerHTML = html;

}


// =================================
// EVENT LISTENERS
// =================================

document
    .getElementById("amount")
    .addEventListener(
        "input",
        renderTable
    );


document
    .getElementById("search")
    .addEventListener(
        "input",
        renderTable
    );


document
    .getElementById("base")
    .addEventListener(
        "change",
        loadRates
    );


// =================================
// START APPLICATION
// =================================

loadRates();

</script>

</body>

</html>
