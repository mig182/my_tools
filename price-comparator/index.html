<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop/Item Price Comparator</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:25px;background:#f5f7fa;color:#172033}.wrap{max-width:1200px;margin:auto}.shops{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card,.custom{background:white;padding:14px;border:1px solid #dce2ea;border-radius:12px}.card input,.custom input{box-sizing:border-box;width:100%;padding:8px;margin:4px 0 10px;border:1px solid #b9c2cf;border-radius:7px}.custom{margin:15px 0}.customs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{padding:9px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer;margin-right:8px}table{width:100%;border-collapse:collapse;background:white;margin-top:15px}th{background:#172033;color:white}th,td{padding:9px;border:1px solid #dde3eb;text-align:right}th:first-child,td:first-child{text-align:left}.best{background:#d9f6e8;color:#12633e;font-weight:700}@media(max-width:850px){.shops{grid-template-columns:1fr}.customs{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>5-Shop Price Comparator</h1><p>Enter each shop's pack price and pack weight in grams. Results update automatically.</p>
<div id="shops" class="shops"></div>
<div class="custom"><h3>Custom Weights</h3><div class="customs"><input id="c0" type="number" min="0" placeholder="Custom 1 (gm)"><input id="c1" type="number" min="0" placeholder="Custom 2 (gm)"><input id="c2" type="number" min="0" placeholder="Custom 3 (gm)"></div></div>
<button type="button" onclick="clearAll()">Clear</button>
<div style="overflow:auto"><table><thead><tr id="head"><th>Weight</th></tr></thead><tbody id="body"></tbody></table></div>
<p>Green cells show the lowest equivalent price.</p></div>
<script>
const standard=[1,2,5,10,20,25,50,100,200,250,500,1000];
const shops=document.getElementById('shops');
for(let i=0;i<5;i++){shops.innerHTML+=`<div class="card"><b>Shop ${i+1}</b><br><label>Shop name</label><input id="n${i}" value="Shop ${i+1}"><label>Price (Rs.)</label><input id="p${i}" type="number" min="0" step="any"><label>Weight (gm)</label><input id="w${i}" type="number" min="0" step="any"></div>`}
function num(id){let v=parseFloat(document.getElementById(id).value);return Number.isFinite(v)&&v>0?v:null}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function calc(){let pg=[],names=[];for(let i=0;i<5;i++){let p=num('p'+i),w=num('w'+i);pg.push(p!==null&&w!==null?p/w:null);names.push(document.getElementById('n'+i).value||`Shop ${i+1}`)}let weights=[...standard];for(let i=0;i<3;i++){let c=num('c'+i);if(c!==null&&!weights.includes(c))weights.push(c)}weights.sort((a,b)=>a-b);document.getElementById('head').innerHTML='<th>Weight</th>'+names.map(n=>`<th>${escapeHtml(n)}</th>`).join('');let out='';for(const g of weights){let vals=pg.map(x=>x===null?null:x*g),valid=vals.filter(x=>x!==null),best=valid.length?Math.min(...valid):null;out+=`<tr><td>${g>=1000?(g/1000)+' kg':g+' gm'}</td>`+vals.map(v=>v===null?'<td>-</td>':`<td class="${Math.abs(v-best)<1e-9?'best':''}">Rs. ${v.toFixed(2)}</td>`).join('')+'</tr>'}document.getElementById('body').innerHTML=out}
function clearAll(){for(let i=0;i<5;i++){document.getElementById('n'+i).value=`Shop ${i+1}`;document.getElementById('p'+i).value='';document.getElementById('w'+i).value=''}for(let i=0;i<3;i++)document.getElementById('c'+i).value='';calc()}
document.getElementById('shops').addEventListener('input',calc);
document.querySelector('.customs').addEventListener('input',calc);
calc();
</script></body></html>
